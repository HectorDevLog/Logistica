<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexNet - Iniciar Sesión</title>
    <script src="seguridad.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1; --slate-500: #64748b; --slate-700: #334155; --slate-900: #0f172a;
            --blue-600: #2563eb; --blue-700: #1d4ed8; --blue-50: #eff6ff;
            --red-600: #dc2626; --red-50: #fef2f2;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background: linear-gradient(135deg, var(--slate-900) 0%, var(--slate-700) 100%); /* Fondo degradado elegante */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--slate-700);
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; /* Bordes más redondeados */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1); 
            text-align: center; 
        }

        .brand-icon {
            color: var(--blue-600);
            margin-bottom: 15px;
        }

        h2 { 
            color: var(--slate-900); 
            margin: 0 0 10px 0; 
            font-size: 1.6em;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle { 
            color: var(--slate-500); 
            margin: 0 0 30px 0; 
            font-size: 0.95em;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--slate-700);
        }

        input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--slate-300); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1em; 
            font-family: inherit;
            transition: all 0.2s;
            background: var(--slate-50);
        }

        input:focus {
            outline: none;
            border-color: var(--blue-600);
            box-shadow: 0 0 0 3px var(--blue-50);
            background: white;
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--blue-600); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1em; 
            cursor: pointer; 
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        button:hover:not(:disabled) { 
            background: var(--blue-700); 
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        button:disabled {
            background: var(--slate-300);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #errorMsg { 
            background: var(--red-50);
            color: var(--red-600); 
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em; 
            display: none; 
            margin-bottom: 20px; 
            font-weight: 600;
            border: 1px solid #fecaca;
        }

        .loader-spinner { 
            display: inline-block; 
            width: 16px; 
            height: 16px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 50%; 
            border-top-color: white; 
            animation: spin 1s ease-in-out infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-text {
            margin-top: 25px;
            font-size: 0.75em;
            color: var(--slate-500);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        
        <div class="brand-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
        </div>

        <h2>FlexNet Operaciones</h2>
        <p class="subtitle">Ingresa tus credenciales corporativas</p>
        
        <div id="errorMsg">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            Usuario o contraseña incorrectos.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="user">Usuario</label>
                <input type="text" id="user" placeholder="Ej. jperez" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnIngresar">
                Iniciar Sesión
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            </button>
        </form>
        
        <div class="footer-text">
            Sistema de Auditoría y Control Logístico v1.0
        </div>
    </div>
</div>

<script>
    // Si ya hay sesión iniciada, mandarlo directo al inicio sin pedir login
    let sesion = JSON.parse(localStorage.getItem('sesionActiva'));
    if (sesion && sesion.status === 'success') {
        window.location.href = 'Inicio.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnIngresar');
        const errorDiv = document.getElementById('errorMsg');
        
        btn.innerHTML = `<span class="loader-spinner"></span> Verificando...`;
        btn.disabled = true;
        errorDiv.style.display = 'none'; 

        // Usamos trim() para borrar espacios accidentales
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();

        try {
            // El v=... evita caché
            const urlLogin = `${SCRIPT_URL}?action=login&usuario=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}&v=${new Date().getTime()}`;
            const response = await fetch(urlLogin);
            const data = await response.json();

            if (data.status === 'success') {
                localStorage.setItem('sesionActiva', JSON.stringify(data));
                window.location.href = 'Inicio.html';
            } else {
                errorDiv.style.display = 'block';
                btn.innerHTML = `Iniciar Sesión <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>`;
                btn.disabled = false;
            }
        } catch (err) {
            errorDiv.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Error de conexión con el servidor.`;
            errorDiv.style.display = 'block';
            btn.innerHTML = `Iniciar Sesión <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>`;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
