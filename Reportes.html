<head>
<meta charset="UTF-8">

<title>Dashboard · Rentabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* ---- Filtros ---- */
  .filtros { display: flex; gap: var(--s-3); align-items: flex-end; flex-wrap: wrap; }
  .filtros .field.mini { margin: 0; min-width: 132px; }
  .filtros .field.mini label { font-size: var(--t-xs); margin-bottom: 3px; }
  .filtros .field.mini input, .filtros .field.mini select { padding: 6px 9px; font-size: var(--t-sm); }
  .atajos { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 18px; }
  .atajos .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---- Impresión / Guardar como PDF ----
     Se imprime el tablero, no la aplicación: fuera el menú, los botones y
     los controles de filtro, pero se deja la línea que dice qué filtros
     estaban puestos, que es lo que da sentido a los números en el papel. */
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    .topbar, .nav, .filtros, .btn { display: none !important; }
    #cajaFiltros { border: 0; box-shadow: none; padding: 0; margin-bottom: 8mm; }
    #cajaFiltros .card-body { padding: 0; }
    #resumenFiltro { font-size: 11pt; color: #000; }
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .stat { break-inside: avoid; }
    table.data { font-size: 9pt; }
    thead { display: table-header-group; }   /* la cabecera se repite por página */
    tr { break-inside: avoid; }
    .scroll-y, .table-wrap { max-height: none !important; overflow: visible !important; }
  }

  /* ---- Lienzo de gráficos ---- */
  .viz { position: relative; }
  .viz svg { display: block; width: 100%; height: auto; overflow: visible; }
  .viz text { font-family: var(--font); fill: var(--ink-muted); font-size: 11px; }
  .viz .eje-linea { stroke: var(--grid-line); stroke-width: 1; }
  .viz .serie { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .viz .area { opacity: .1; }
  .viz .punto { r: 4; stroke: var(--surface-raised); stroke-width: 2; }
  .viz .cruz { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .viz .marca-fin { font-weight: 700; font-size: 11px; }

  /* Tooltip */
  .tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--surface-raised); border: 1px solid var(--line-strong);
    border-radius: var(--r-sm); box-shadow: var(--shadow-lg);
    padding: 8px 10px; font-size: var(--t-xs); min-width: 130px;
    transform: translate(-50%, -100%); opacity: 0; transition: opacity .12s;
  }
  .tip.on { opacity: 1; }
  .tip .t-f { font-weight: 700; color: var(--ink); margin-bottom: 5px; }
  .tip .t-l { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); line-height: 1.7; }
  .tip .t-l span { display: flex; align-items: center; gap: 5px; color: var(--ink-soft); }
  .tip .t-l b { font-variant-numeric: tabular-nums; color: var(--ink); }
  .tip .sw { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* Leyenda */
  .leyenda { display: flex; gap: var(--s-4); flex-wrap: wrap; align-items: center; }
  .leyenda i { display: flex; align-items: center; gap: 6px; font-style: normal; font-size: var(--t-xs); font-weight: 600; color: var(--ink-soft); }
  .leyenda .sw { width: 10px; height: 3px; border-radius: 2px; }

  /* Ranking horizontal */
  .rank { display: grid; gap: 9px; }
  .rank-fila { display: grid; grid-template-columns: 96px 1fr 92px; gap: var(--s-3); align-items: center; font-size: var(--t-sm); }
  .rank-fila .quien { font-weight: 620; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-pista { height: 18px; background: var(--surface-sunken); border-radius: var(--r-sm); overflow: hidden; position: relative; }
  .rank-pista i { display: block; height: 100%; border-radius: var(--r-sm); background: var(--serie-1); }
  .rank-pista i.neg { background: var(--danger); }
  .rank-fila .valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
  @media (max-width: 520px) { .rank-fila { grid-template-columns: 78px 1fr 78px; font-size: var(--t-xs); } }

  /* Comparativa proyección vs real: la barra muestra de qué lado cae la desviación */
  .desv { position: relative; height: 16px; background: var(--surface-sunken); border-radius: var(--r-sm); overflow: hidden; min-width: 70px; }
  .desv .eje { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
  .desv i { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; }
  .desv i.pos { left: 50%; background: var(--ok); }
  .desv i.neg { right: 50%; background: var(--danger); }

  .delta { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-xs); font-weight: 700; }
  .delta.up { color: var(--ok); } .delta.down { color: var(--danger); }
  /* Tablas ordenables: vehículos y cartas porte */
  #tablaVeh th[data-orden], #tablaCP th[data-orden] { cursor: pointer; user-select: none; white-space: nowrap; }
  #tablaVeh th[data-orden]:hover, #tablaCP th[data-orden]:hover { color: var(--accent); }
  #tablaVeh th.ordenado, #tablaCP th.ordenado { color: var(--accent); }
  #tablaVeh th.ordenado::after, #tablaCP th.ordenado::after { content: ' ▾'; font-size: .8em; }
  #tablaVeh th.ordenado[data-dir="asc"]::after, #tablaCP th.ordenado[data-dir="asc"]::after { content: ' ▴'; }
  #tablaVeh tr.veh-rojo td, #tablaCP tr.veh-rojo td { background: var(--danger-soft); }
  #tablaVeh tfoot td, #tablaCP tfoot td { border-top: 2px solid var(--line-strong); background: var(--surface-inset); }
  #tablaCP tbody tr:hover td { background: var(--surface-inset); }
  #tablaCP a.link { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--line-strong); }
  #tablaCP a.link:hover { color: var(--accent); border-bottom-color: currentColor; }
  /* Con una lista de cartas porte puesta, el rango de fechas no filtra nada:
     se ve apagado para que nadie lo mueva esperando que cambie algo. */
  #cajaFiltros.con-lista #fDesde,
  #cajaFiltros.con-lista #fHasta,
  #cajaFiltros.con-lista .atajos[role="group"] { opacity: .45; }

  /* Buscador dentro de la tabla: no toca los filtros de arriba */
  .mini-busca { width: 170px; padding: 6px 9px; font-size: var(--t-sm);
                border: 1px solid var(--line); border-radius: var(--r-sm);
                background: var(--surface); color: var(--ink); }
</style>
</head>
<body data-modulo="dashboard">

<main class="page">

  <div class="page-head">
    <div>
      <div class="eyebrow">Indicadores</div>
      <h1>Dashboard</h1>
      <p class="sub" id="subtitulo">Cómo viene la operación y quién la está moviendo.</p>
    </div>
  </div>

  <!-- Filtros. El rango de fechas es libre; los botones de al lado son
       atajos a los periodos que se miran todos los días. -->
  <div class="card mb-5" id="cajaFiltros">
    <div class="card-body">
      <div class="filtros">
        <div class="field mini"><label for="fDesde">Desde</label>
          <input type="date" id="fDesde"></div>
        <div class="field mini"><label for="fHasta">Hasta</label>
          <input type="date" id="fHasta"></div>

        <div class="atajos" role="group" aria-label="Periodos rápidos">
          <button class="btn btn-default btn-sm" data-atajo="hoy">Hoy</button>
          <button class="btn btn-default btn-sm" data-atajo="ayer">Ayer</button>
          <button class="btn btn-default btn-sm" data-atajo="7">7 días</button>
          <button class="btn btn-default btn-sm" data-atajo="30">30 días</button>
          <button class="btn btn-default btn-sm" data-atajo="mes">Este mes</button>
          <button class="btn btn-default btn-sm" data-atajo="90">90 días</button>
        </div>

        <div class="field mini"><label for="filtroCiudad">Ciudad</label>
          <select id="filtroCiudad"><option value="TODAS">Todas</option></select></div>
        <div class="field mini"><label for="filtroCliente">Cliente</label>
          <select id="filtroCliente"><option value="TODOS">Todos</option></select></div>
        <div class="field mini"><label for="filtroUsuario">Ingresado por</label>
          <select id="filtroUsuario"><option value="TODOS">Todos</option></select></div>
        <div class="field mini"><label for="filtroProveedor">Proveedor</label>
          <select id="filtroProveedor"><option value="TODOS">Todos</option></select></div>
        <div class="field mini"><label for="filtroRuta">Tipo de ruta</label>
          <select id="filtroRuta"><option value="TODOS">Todos</option></select></div>
        <div class="field mini"><label for="filtroBusca">Placa o carta porte</label>
          <input type="search" id="filtroBusca" placeholder="Buscar…" autocomplete="off"></div>
        <!-- Lista de cartas porte: para mirar un grupo concreto —las de un
             despacho, las que salieron raras— sin depender de la fecha. -->
        <div class="field mini" style="min-width:210px"><label for="filtroCP">Cartas porte (varias)</label>
          <input type="search" id="filtroCP" placeholder="70236, 70237, 70240…" autocomplete="off"></div>

        <button class="btn btn-ghost btn-sm" id="btnLimpiar" style="margin-top:18px">Limpiar</button>
        <div class="atajos" style="margin-left:auto;margin-top:18px">
          <button class="btn btn-default btn-sm" id="btnExcel" title="Descarga lo que estás viendo, con los filtros puestos">Excel</button>
          <button class="btn btn-default btn-sm" id="btnPdf" title="Abre el diálogo de impresión: elige «Guardar como PDF»">PDF</button>
        </div>
      </div>
      <div class="fs-xs muted mt-2" id="resumenFiltro"></div>
    </div>
  </div>

  <div id="contenido">
    <div class="grid grid-4 mb-5">
      <div class="stat"><div class="skel" style="height:14px;width:55%"></div><div class="skel mt-3" style="height:30px;width:75%"></div></div>
      <div class="stat"><div class="skel" style="height:14px;width:55%"></div><div class="skel mt-3" style="height:30px;width:75%"></div></div>
      <div class="stat"><div class="skel" style="height:14px;width:55%"></div><div class="skel mt-3" style="height:30px;width:75%"></div></div>
      <div class="stat"><div class="skel" style="height:14px;width:55%"></div><div class="skel mt-3" style="height:30px;width:75%"></div></div>
    </div>
    <div class="card"><div class="card-body"><div class="skel" style="height:240px"></div></div></div>
  </div>

</main>

<!-- jsPDF y su complemento de tablas, servidos desde la propia carpeta.
     No van por CDN a propósito: el sistema tiene que poder generar el PDF
     aunque la máquina esté sin internet. -->
<script src="assets/vendor/jspdf.umd.min.js"></script>
<script src="assets/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/tarifas.js"></script>
<script src="assets/api.js"></script>
<script>
FX.listo(async (sesion) => {
  'use strict';
  if (!sesion) return;

  const $ = id => document.getElementById(id);
  /* Lo último que pintó render(). Lo leen los botones de descarga. */
  let loQueSeVe = { filas: [], filtro: null };

  const costoDe = r => (Number(r.cBase)||0) + (Number(r.cExc)||0) + (Number(r.cAyudantes)||0) + (Number(r.cHE)||0);

  let TODAS = [];

  /* ==================================================================
     UTILIDADES DE DIBUJO
     ================================================================== */
  const tinta = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /** Escala "bonita" para el eje: topes en 1, 2, 2.5 o 5 por década. */
  function techo(max) {
    if (max <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(max)));
    const n = max / exp;
    const paso = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return paso * exp;
  }

  /**
   * Gráfico de líneas: ingresos y costos en el mismo eje.
   * Un solo eje a propósito: son la misma magnitud y deben poder compararse
   * directamente. Dos escalas distintas mentirían sobre la distancia entre ambos.
   */
  function graficoLineas(host, dias, series) {
    const W = 840, H = 280;
    const M = { top: 16, right: 58, bottom: 30, left: 60 };
    const ancho = W - M.left - M.right;
    const alto  = H - M.top - M.bottom;

    const maximo = techo(Math.max(...series.flatMap(s => s.datos), 1));
    const x = i => M.left + (dias.length <= 1 ? ancho / 2 : (i / (dias.length - 1)) * ancho);
    const y = v => M.top + alto - (v / maximo) * alto;

    // Rejilla y etiquetas del eje vertical
    let rejilla = '';
    for (let i = 0; i <= 4; i++) {
      const v = (maximo / 4) * i;
      const py = y(v);
      rejilla += `<line class="eje-linea" x1="${M.left}" y1="${py}" x2="${W - M.right}" y2="${py}"/>
                  <text x="${M.left - 8}" y="${py + 4}" text-anchor="end">${FX.fmt.moneyK(v)}</text>`;
    }

    // Etiquetas del eje horizontal. Se marca la última solo si no queda
    // encima de la anterior: dos fechas pisadas no se leen.
    const salto = Math.max(1, Math.ceil(dias.length / 7));
    const marcas = [];
    for (let i = 0; i < dias.length; i += salto) marcas.push(i);

    const ultimo = dias.length - 1;
    if (marcas[marcas.length - 1] !== ultimo) {
      // Si la última fecha queda pegada a la anterior, la reemplaza en vez de sumarse
      if (ultimo - marcas[marcas.length - 1] < salto * 0.6) marcas[marcas.length - 1] = ultimo;
      else marcas.push(ultimo);
    }

    const ejeX = marcas
      .map(i => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${FX.fmt.fechaCorta(dias[i])}</text>`)
      .join('');

    // Etiquetas de fin de línea: si las dos series terminan juntas, se
    // separan verticalmente para que ninguna quede ilegible.
    const finales = series.map((s, i) => ({ i, valor: s.datos[s.datos.length - 1], y: y(s.datos[s.datos.length - 1]) }))
                          .sort((a, b) => a.y - b.y);
    const MINIMA = 13;
    for (let k = 1; k < finales.length; k++) {
      if (finales[k].y - finales[k - 1].y < MINIMA) finales[k].y = finales[k - 1].y + MINIMA;
    }
    const yEtiqueta = {};
    finales.forEach(f => { yEtiqueta[f.i] = f.y; });

    const trazos = series.map((s, si) => {
      const puntos = s.datos.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      const area = `${M.left},${y(0)} ${puntos} ${x(s.datos.length - 1)},${y(0)}`;
      const ultimo = s.datos[s.datos.length - 1];
      return `
        <polygon class="area" points="${area}" fill="${s.color}"/>
        <polyline class="serie" points="${puntos}" stroke="${s.color}"/>
        <text class="marca-fin" x="${W - M.right + 8}" y="${yEtiqueta[si] + 4}" fill="${s.color}">${FX.fmt.moneyK(ultimo)}</text>`;
    }).join('');

    const puntosHover = series.map((s, si) =>
      `<circle class="punto" data-serie="${si}" fill="${s.color}" cx="0" cy="0" opacity="0"/>`).join('');

    host.innerHTML = `
      <div class="viz">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y costos por día">
          ${rejilla}${ejeX}${trazos}
          <line class="cruz" x1="0" y1="${M.top}" x2="0" y2="${M.top + alto}" opacity="0"/>
          ${puntosHover}
          <rect x="${M.left}" y="${M.top}" width="${ancho}" height="${alto}" fill="transparent" data-captura/>
        </svg>
        <div class="tip"></div>
      </div>`;

    /* --- Capa de interacción: cruz + tooltip --- */
    const viz = host.querySelector('.viz');
    const svg = viz.querySelector('svg');
    const cruz = viz.querySelector('.cruz');
    const tip = viz.querySelector('.tip');
    const puntos = [...viz.querySelectorAll('.punto')];
    const captura = viz.querySelector('[data-captura]');

    function mover(evento) {
      const caja = svg.getBoundingClientRect();
      const escala = W / caja.width;
      const px = (evento.clientX - caja.left) * escala;
      const i = Math.max(0, Math.min(dias.length - 1,
        Math.round(((px - M.left) / ancho) * (dias.length - 1))));

      cruz.setAttribute('x1', x(i)); cruz.setAttribute('x2', x(i)); cruz.setAttribute('opacity', '1');
      puntos.forEach((p, si) => {
        p.setAttribute('cx', x(i)); p.setAttribute('cy', y(series[si].datos[i])); p.setAttribute('opacity', '1');
      });

      tip.innerHTML = `<div class="t-f">${FX.fmt.fecha(dias[i])}</div>` +
        series.map(s => `<div class="t-l">
            <span><i class="sw" style="background:${s.color}"></i>${s.nombre}</span>
            <b>${FX.fmt.money(s.datos[i])}</b></div>`).join('') +
        `<div class="t-l" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">
            <span>Utilidad</span>
            <b class="${series[0].datos[i] - series[1].datos[i] < 0 ? 'c-danger' : 'c-ok'}">
              ${FX.fmt.money(series[0].datos[i] - series[1].datos[i])}</b></div>`;

      tip.classList.add('on');
      tip.style.left = `${(x(i) / W) * 100}%`;
      tip.style.top = `${(Math.min(y(series[0].datos[i]), y(series[1].datos[i])) / H) * 100 - 3}%`;
    }

    captura.addEventListener('mousemove', mover);
    captura.addEventListener('touchmove', e => { mover(e.touches[0]); e.preventDefault(); }, { passive: false });
    viz.addEventListener('mouseleave', () => {
      tip.classList.remove('on');
      cruz.setAttribute('opacity', '0');
      puntos.forEach(p => p.setAttribute('opacity', '0'));
    });
  }

  /** Barras de utilidad diaria: el signo es el dato, por eso verde/rojo. */
  function graficoBarras(host, dias, valores) {
    const W = 840, H = 200;
    const M = { top: 14, right: 16, bottom: 26, left: 60 };
    const ancho = W - M.left - M.right;
    const alto  = H - M.top - M.bottom;

    const maxAbs = techo(Math.max(...valores.map(Math.abs), 1));
    const hayNeg = valores.some(v => v < 0);
    const cero = hayNeg ? M.top + alto / 2 : M.top + alto;
    const escala = hayNeg ? (alto / 2) / maxAbs : alto / maxAbs;

    const paso = ancho / valores.length;
    const anchoBarra = Math.max(2, paso - 2);   // 2px de aire entre barras

    const barras = valores.map((v, i) => {
      const h = Math.max(1, Math.abs(v) * escala);
      const py = v >= 0 ? cero - h : cero;
      const px = M.left + i * paso + 1;
      const color = v < 0 ? tinta('--danger') : tinta('--ok');
      return `<rect x="${px}" y="${py}" width="${anchoBarra}" height="${h}" rx="2" fill="${color}" opacity=".85">
                <title>${FX.fmt.fecha(dias[i])}: ${FX.fmt.money(v)}</title></rect>`;
    }).join('');

    // Mismo criterio que el gráfico de líneas: la última fecha reemplaza a la
    // anterior si quedaría encima, en vez de sumarse y pisarla.
    const salto = Math.max(1, Math.ceil(dias.length / 7));
    const marcas = [];
    for (let i = 0; i < dias.length; i += salto) marcas.push(i);
    const ultimo = dias.length - 1;
    if (marcas[marcas.length - 1] !== ultimo) {
      if (ultimo - marcas[marcas.length - 1] < salto * 0.6) marcas[marcas.length - 1] = ultimo;
      else marcas.push(ultimo);
    }
    const ejeX = marcas.map(i =>
      `<text x="${M.left + i * paso + anchoBarra / 2}" y="${H - 8}" text-anchor="middle">${FX.fmt.fechaCorta(dias[i])}</text>`
    ).join('');

    host.innerHTML = `
      <div class="viz">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Utilidad por día">
          <line class="eje-linea" x1="${M.left}" y1="${cero}" x2="${W - M.right}" y2="${cero}"/>
          <text x="${M.left - 8}" y="${cero + 4}" text-anchor="end">$0</text>
          <text x="${M.left - 8}" y="${M.top + 10}" text-anchor="end">${FX.fmt.moneyK(maxAbs)}</text>
          ${hayNeg ? `<text x="${M.left - 8}" y="${M.top + alto}" text-anchor="end">−${FX.fmt.moneyK(maxAbs)}</text>` : ''}
          ${barras}${ejeX}
        </svg>
      </div>`;
  }

  /** Ranking horizontal. Una sola serie: sin leyenda, con etiqueta directa. */
  function ranking(host, filas, formato) {
    const tope = Math.max(...filas.map(f => Math.abs(f.valor)), 1);
    host.innerHTML = `<div class="rank">` + filas.map(f => `
      <div class="rank-fila">
        <span class="quien" title="${FX.escapar(f.nombre)}">${FX.escapar(f.nombre)}</span>
        <span class="rank-pista"><i class="${f.valor < 0 ? 'neg' : ''}" style="width:${Math.max(2, (Math.abs(f.valor) / tope) * 100)}%"></i></span>
        <span class="valor ${f.valor < 0 ? 'c-danger' : ''}">${formato(f.valor)}</span>
      </div>`).join('') + `</div>`;
  }

  /* ==================================================================
     ARMADO
     ================================================================== */
  /** Días entre dos fechas ISO, contando ambos extremos. */
  function largoEnDias(desdeISO, hastaISO) {
    const ms = new Date(hastaISO + 'T00:00:00') - new Date(desdeISO + 'T00:00:00');
    return Math.max(1, Math.round(ms / 86400000) + 1);
  }
  const sumaDias = (iso, n) => {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  };

  function render(f) {
    const desdeISO = f.desde, hastaISO = f.hasta;
    const dias = largoEnDias(desdeISO, hastaISO);

    /* Un filtro vale «TODAS/TODOS» o el valor exacto. La búsqueda libre mira
       placa y carta porte a la vez, que es como la gente busca. */
    const busca = String(f.busca || '').trim().toUpperCase();

    /* Lista de cartas porte concretas. Cuando hay una lista, manda ella: se
       muestran esas cartas porte estén en la fecha que estén, porque quien
       pega una lista quiere ver ESAS y no le sirve que el rango se las coma. */
    const soloCP = (f.cps && f.cps.length) ? new Set(f.cps) : null;

    /* Todo lo que no es fecha se comprueba aparte, porque el comparativo
       necesita los MISMOS filtros sobre OTRA ventana de fechas. */
    const cumple = r =>
      (!soloCP || soloCP.has(API.claveCodigo(r.cartaPorte))) &&
      (f.ciudad    === 'TODAS' || r.ciudad === f.ciudad) &&
      (f.usuario   === 'TODOS' || r.usuario === f.usuario) &&
      (f.proveedor === 'TODOS' || r.proveedor === f.proveedor) &&
      (f.tipoRuta  === 'TODOS' || r.tipoRuta === f.tipoRuta) &&
      (f.cliente   === 'TODOS' || (r.clientes && r.clientes.has(f.cliente))) &&
      (!busca || String(r.placa).toUpperCase().includes(busca)
              || String(r.cartaPorte).toUpperCase().includes(busca));

    // Con lista de cartas porte el rango no filtra: la lista ya dice cuáles.
    const entre = (r, a, b) => soloCP ? true : (r.fecha >= a && r.fecha <= b);

    const periodo = TODAS.filter(r => entre(r, desdeISO, hastaISO) && cumple(r));
    // Lo que se está viendo, para que los botones de descarga exporten
    // exactamente esto y no todo el histórico.
    loQueSeVe = { filas: periodo, filtro: f };

    // El periodo anterior del mismo largo, justo antes
    const finAnt = sumaDias(desdeISO, -1);
    const iniAnt = sumaDias(desdeISO, -dias);
    /* Con una lista de cartas porte no hay «periodo anterior» con el que
       compararse —son las que son—, así que las flechas de variación se
       apagan en vez de comparar el conjunto consigo mismo. */
    const anterior = soloCP ? [] : TODAS.filter(r => entre(r, iniAnt, finAnt) && cumple(r));

    const suma = arr => ({
      ing: arr.reduce((s, r) => s + (Number(r.ingresos) || 0), 0),
      cos: arr.reduce((s, r) => s + costoDe(r), 0),
      ped: arr.reduce((s, r) => s + (Number(r.pedidos) || 0), 0),
      rutas: arr.length
    });

    const a = suma(periodo), b = suma(anterior);
    const utilA = a.ing - a.cos, utilB = b.ing - b.cos;
    const margenA = a.ing ? (utilA / a.ing) * 100 : 0;
    const margenB = b.ing ? (utilB / b.ing) * 100 : 0;

    const variacion = (act, ant) => {
      if (!ant) return '';
      const pct = ((act - ant) / Math.abs(ant)) * 100;
      if (!isFinite(pct)) return '';
      const sube = pct >= 0;
      return `<span class="delta ${sube ? 'up' : 'down'}">${sube ? '▲' : '▼'} ${FX.fmt.dec(Math.abs(pct), 1)}%</span>
              <span class="muted">vs. periodo anterior</span>`;
    };

    if (!periodo.length) {
      $('contenido').innerHTML = `<div class="card"><div class="empty">${FX.icono('chart')}
        <h4>Sin datos con estos filtros</h4>
        <p>${soloCP
            ? (soloCP.size === 1
                ? `La carta porte que pusiste no está guardada, o no pasa los otros filtros.`
                : `Ninguna de las ${soloCP.size} cartas porte que pusiste está guardada, o no pasan los otros filtros.`)
            : `No hay cartas porte cerradas entre el ${FX.fmt.fecha(desdeISO)} y el ${FX.fmt.fecha(hastaISO)}
               con lo que tienes seleccionado.`}</p>
        <button class="btn btn-default mt-4" id="btnLimpiar2">Quitar los filtros</button></div></div>`;
      const b = $('btnLimpiar2');
      if (b) b.onclick = () => $('btnLimpiar').click();
      return;
    }

    // --- Series diarias ---
    const porDia = {};
    periodo.forEach(r => {
      if (!porDia[r.fecha]) porDia[r.fecha] = { ing: 0, cos: 0 };
      porDia[r.fecha].ing += Number(r.ingresos) || 0;
      porDia[r.fecha].cos += costoDe(r);
    });
    const fechas = Object.keys(porDia).sort();
    const serieIng = fechas.map(f => porDia[f].ing);
    const serieCos = fechas.map(f => porDia[f].cos);
    const serieUti = fechas.map((f, i) => serieIng[i] - serieCos[i]);

    // --- Rankings ---
    const porVehiculo = {};
    periodo.forEach(r => {
      const k = r.placa || '—';
      if (!porVehiculo[k]) porVehiculo[k] = { util: 0, ing: 0, cos: 0, rutas: 0, ped: 0, prov: {}, tipos: {} };
      const v = porVehiculo[k];
      v.util += (Number(r.ingresos) || 0) - costoDe(r);
      v.ing  += Number(r.ingresos) || 0;
      v.cos  += costoDe(r);
      v.ped  += Number(r.pedidos) || 0;
      v.rutas++;
      if (r.proveedor) v.prov[r.proveedor] = (v.prov[r.proveedor] || 0) + 1;
      if (r.tipoRuta)  v.tipos[r.tipoRuta]  = (v.tipos[r.tipoRuta]  || 0) + 1;
    });
    const rankVehiculos = Object.entries(porVehiculo)
      .map(([nombre, v]) => ({ nombre, valor: v.util }))
      .sort((x, y) => y.valor - x.valor).slice(0, 8);

    const porTipo = {};
    periodo.forEach(r => {
      const k = r.tipoRuta || 'NORMAL';
      porTipo[k] = (porTipo[k] || 0) + (Number(r.ingresos) || 0);
    });
    const rankTipos = Object.entries(porTipo).map(([nombre, valor]) => ({ nombre, valor })).sort((x, y) => y.valor - x.valor);

    const diasOperados = fechas.length;

    /* --- Estructura --- */
    $('contenido').innerHTML = `
      <div class="grid grid-4 mb-5">
        <div class="stat is-ingreso">
          <div class="label">Ingresos</div>
          <div class="value">${FX.fmt.money(a.ing)}</div>
          <div class="foot">${variacion(a.ing, b.ing)}</div>
        </div>
        <div class="stat is-costo">
          <div class="label">Costo operativo</div>
          <div class="value">${FX.fmt.money(a.cos)}</div>
          <div class="foot">${variacion(a.cos, b.cos)}</div>
        </div>
        <div class="stat ${utilA < 0 ? 'is-neg' : 'is-utilidad'}">
          <div class="label">Utilidad</div>
          <div class="value">${FX.fmt.money(utilA)}</div>
          <div class="foot">${variacion(utilA, utilB)}</div>
        </div>
        <div class="stat">
          <div class="label">Margen</div>
          <div class="value ${margenA < 0 ? 'c-danger' : margenA < 15 ? 'c-warn' : 'c-ok'}">${FX.fmt.pct(margenA)}</div>
          <div class="foot">${margenB ? `Antes ${FX.fmt.pct(margenB)}` : '&nbsp;'}</div>
          <div class="meter ${margenA < 0 ? 'danger' : margenA < 15 ? 'warn' : 'ok'}">
            <span style="width:${Math.min(100, Math.max(0, margenA))}%"></span></div>
        </div>
      </div>

      <div class="card mb-5">
        <div class="card-head">
          <h3>Ingresos y costos por día</h3>
          <div class="row">
            <div class="leyenda">
              <i><span class="sw" style="background:var(--serie-1)"></span>Ingresos</i>
              <i><span class="sw" style="background:var(--serie-2)"></span>Costos</i>
            </div>
            <button class="btn btn-ghost btn-sm" id="verTabla">Ver tabla</button>
          </div>
        </div>
        <div class="card-body" id="lienzoLineas"></div>
        <div id="zonaTabla" hidden></div>
      </div>

      <div class="card mb-5">
        <div class="card-head">
          <h3>Utilidad por día</h3>
          <span class="hint">Cada barra es un día operado. En rojo, los que cerraron en pérdida.</span>
        </div>
        <div class="card-body" id="lienzoBarras"></div>
      </div>

      <div class="card mb-5" id="cardComparativa" hidden>
        <div class="card-head">
          <h3>Proyección contra lo que realmente pasó</h3>
          <span class="hint">Solo los días que tienen proyección guardada y operación cerrada.</span>
        </div>
        <div class="card-body flush">
          <div class="table-wrap scroll-y" style="max-height:320px">
            <table class="data" id="tablaComparativa">
              <thead><tr>
                <th>Fecha</th>
                <th class="num">Pedidos<br><span class="fs-xs muted fw-6">proy. → real</span></th>
                <th class="num">Ingresos<br><span class="fs-xs muted fw-6">proy. → real</span></th>
                <th class="num">Utilidad<br><span class="fs-xs muted fw-6">proy. → real</span></th>
                <th style="width:110px">Desviación</th>
              </tr></thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </div>
      </div>

      <!-- Las cartas porte del rango, una por una. El tablero de arriba dice
           cómo va el conjunto; esto dice de qué está hecho, y cada fila lleva
           a su auditoría. -->
      <div class="card mb-5">
        <div class="card-head">
          <div class="row" style="gap:var(--s-3);flex-wrap:wrap;align-items:center;flex:1">
            <h3>Cartas porte del periodo</h3>
            <span class="hint" id="pieCP"></span>
          </div>
          <div class="row" style="gap:var(--s-2)">
            <input type="search" id="buscaCP" class="mini-busca" placeholder="Filtrar en la tabla…"
                   autocomplete="off" aria-label="Filtrar las cartas porte de la tabla">
            <button class="btn btn-default btn-sm" id="btnAuditar"
                    title="Abre la auditoría con todas las cartas porte que estás viendo">Auditar estas</button>
          </div>
        </div>
        <div class="card-body flush">
          <div class="table-wrap scroll-y" style="max-height:440px">
            <table class="data" id="tablaCP">
              <thead>
                <tr>
                  <th data-orden="fecha">Fecha</th>
                  <th data-orden="cartaPorte">Carta porte</th>
                  <th data-orden="ciudad">Ciudad</th>
                  <th data-orden="placa">Placa</th>
                  <th data-orden="proveedor">Proveedor</th>
                  <th data-orden="tipoRuta">Ruta</th>
                  <th class="num" data-orden="ped">Pedidos</th>
                  <th class="num" data-orden="peso">Peso</th>
                  <th class="num" data-orden="ing">Ingresos</th>
                  <th class="num" data-orden="cos">Costos</th>
                  <th class="num" data-orden="util">Utilidad</th>
                  <th class="num" data-orden="margen">Margen</th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-head">
            <h3>Rentabilidad por vehículo</h3>
            <span class="hint" id="pieVeh"></span>
            <span class="hint">Utilidad acumulada en el periodo. Los 8 primeros.</span>
          </div>
          <div class="card-body flush">
            <div class="table-wrap" style="max-height:460px;overflow:auto">
              <table class="data" id="tablaVeh">
                <thead>
                  <tr>
                    <th data-orden="nombre">Placa</th>
                    <th class="num" data-orden="rutas">CP</th>
                    <th class="num" data-orden="ped">Pedidos</th>
                    <th class="num" data-orden="ing">Ingresos</th>
                    <th class="num" data-orden="cos">Costos</th>
                    <th class="num" data-orden="util">Utilidad</th>
                    <th class="num" data-orden="margen">Margen</th>
                  </tr>
                </thead>
                <tbody></tbody>
                <tfoot></tfoot>
              </table>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Resumen del periodo</h3></div>
          <div class="card-body">
            <div class="dato-lista">
              ${[
                ['Días operados', FX.fmt.num(diasOperados)],
                ['Cartas porte cerradas', FX.fmt.num(a.rutas)],
                ['Pedidos entregados', FX.fmt.num(a.ped)],
                ['Ingreso por pedido', FX.fmt.money(a.ped ? a.ing / a.ped : 0)],
                ['Costo por pedido', FX.fmt.money(a.ped ? a.cos / a.ped : 0)],
                ['Utilidad por día', FX.fmt.money(diasOperados ? utilA / diasOperados : 0)],
                ['Pedidos por carta porte', FX.fmt.dec(a.rutas ? a.ped / a.rutas : 0, 1)]
              ].map(([k, v]) => `<div class="dato" style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:var(--t-sm)">
                    <span class="muted">${k}</span><b style="font-variant-numeric:tabular-nums">${v}</b></div>`).join('')}
            </div>
            <div class="mt-4" id="rankTipos"></div>
          </div>
        </div>
      </div>`;

    graficoLineas($('lienzoLineas'), fechas, [
      { nombre: 'Ingresos', datos: serieIng, color: tinta('--serie-1') },
      { nombre: 'Costos',   datos: serieCos, color: tinta('--serie-2') }
    ]);

    graficoBarras($('lienzoBarras'), fechas, serieUti);
    pintarComparativa(periodo, f.ciudad);
    pintarVehiculos(porVehiculo);
    pintarCartasPorte(periodo);

    $('rankTipos').innerHTML = `<div class="label mb-2">Ingreso por tipo de ruta</div>`;
    const host = document.createElement('div');
    $('rankTipos').appendChild(host);
    ranking(host, rankTipos, FX.fmt.money);

    /* --- Vista de tabla: el mismo dato en texto, para quien lo necesite --- */
    $('verTabla').onclick = () => {
      const zona = $('zonaTabla');
      const abierta = !zona.hidden;
      zona.hidden = abierta;
      $('verTabla').textContent = abierta ? 'Ver tabla' : 'Ver gráfico';
      $('lienzoLineas').hidden = !abierta;
      if (abierta || zona.dataset.listo) return;

      zona.dataset.listo = '1';
      zona.innerHTML = `<div class="table-wrap scroll-y" style="max-height:340px"><table class="data">
        <thead><tr><th>Fecha</th><th class="num">Ingresos</th><th class="num">Costos</th><th class="num">Utilidad</th></tr></thead>
        <tbody>${fechas.map((f, i) => `<tr>
            <td><b>${FX.fmt.fecha(f)}</b></td>
            <td class="num c-ingreso">${FX.fmt.money(serieIng[i])}</td>
            <td class="num c-costo">${FX.fmt.money(serieCos[i])}</td>
            <td class="num ${serieUti[i] < 0 ? 'c-danger' : 'c-ok'}">${FX.fmt.money(serieUti[i])}</td>
          </tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td>
          <td class="num c-ingreso">${FX.fmt.money(a.ing)}</td>
          <td class="num c-costo">${FX.fmt.money(a.cos)}</td>
          <td class="num ${utilA < 0 ? 'c-danger' : 'c-ok'}">${FX.fmt.money(utilA)}</td></tr></tfoot>
      </table></div>`;
    };

    $('subtitulo').textContent =
      `${FX.fmt.num(a.rutas)} cartas porte y ${FX.fmt.num(a.ped)} pedidos en ${diasOperados} días operados.` +
      (esAdmin ? '' : ' Solo se muestra lo que tú registraste.');
  }

  /**
   * Compara cada proyección guardada contra la operación real de ese día.
   * Es la única forma de saber si proyectar sirve de algo: sin este cruce,
   * las proyecciones se guardan y nadie vuelve a mirarlas.
   */
  /* ==================================================================
     RENTABILIDAD POR VEHÍCULO
     ------------------------------------------------------------------
     Antes era un top 8 en barras: servía para ver quién iba primero, pero
     no para trabajar. Esta tabla trae toda la flota del periodo, con sus
     cartas porte, pedidos, ingresos, costos, utilidad y margen, y se
     ordena por cualquier columna. El total al pie cuadra con los KPI de
     arriba, que es como se comprueba que no falta nadie.
     ================================================================== */
  let ordenVeh = { campo: 'util', desc: true };

  function pintarVehiculos(porVehiculo) {
    const filas = Object.entries(porVehiculo).map(([nombre, v]) => ({
      nombre,
      rutas: v.rutas, ped: v.ped, ing: v.ing, cos: v.cos, util: v.util,
      margen: v.ing > 0 ? (v.util / v.ing) * 100 : 0,
      proveedor: Object.entries(v.prov).sort((a, b) => b[1] - a[1])[0]?.[0] || '',
      tipo: Object.entries(v.tipos).sort((a, b) => b[1] - a[1])[0]?.[0] || ''
    }));

    const { campo, desc } = ordenVeh;
    filas.sort((a, b) => {
      const x = a[campo], y = b[campo];
      const cmp = typeof x === 'string' ? String(x).localeCompare(String(y)) : x - y;
      return desc ? -cmp : cmp;
    });

    const tot = filas.reduce((t, f) => {
      t.rutas += f.rutas; t.ped += f.ped; t.ing += f.ing; t.cos += f.cos; t.util += f.util;
      return t;
    }, { rutas: 0, ped: 0, ing: 0, cos: 0, util: 0 });

    const enRojo = filas.filter(f => f.util < 0).length;
    $('pieVeh').textContent = `${filas.length} vehículo${filas.length === 1 ? '' : 's'}` +
      (enRojo ? ` · ${enRojo} en pérdida` : '');

    document.querySelector('#tablaVeh tbody').innerHTML = filas.map(f => `
      <tr class="${f.util < 0 ? 'veh-rojo' : ''}">
        <td><b class="mono">${FX.escapar(f.nombre)}</b>
            ${f.proveedor ? `<br><span class="fs-xs muted">${FX.escapar(f.proveedor)}</span>` : ''}</td>
        <td class="num">${FX.fmt.num(f.rutas)}</td>
        <td class="num">${FX.fmt.num(f.ped)}</td>
        <td class="num c-ingreso">${FX.fmt.money(f.ing)}</td>
        <td class="num c-costo">${FX.fmt.money(f.cos)}</td>
        <td class="num ${f.util < 0 ? 'c-danger' : 'c-ok'}"><b>${FX.fmt.money(f.util)}</b></td>
        <td class="num ${f.util < 0 ? 'c-danger' : 'muted'}">${FX.fmt.pct(f.margen)}</td>
      </tr>`).join('') ||
      `<tr><td colspan="7" class="center muted">Sin vehículos en este periodo.</td></tr>`;

    document.querySelector('#tablaVeh tfoot').innerHTML = filas.length ? `
      <tr>
        <td><b>Total</b></td>
        <td class="num"><b>${FX.fmt.num(tot.rutas)}</b></td>
        <td class="num"><b>${FX.fmt.num(tot.ped)}</b></td>
        <td class="num c-ingreso"><b>${FX.fmt.money(tot.ing)}</b></td>
        <td class="num c-costo"><b>${FX.fmt.money(tot.cos)}</b></td>
        <td class="num ${tot.util < 0 ? 'c-danger' : 'c-ok'}"><b>${FX.fmt.money(tot.util)}</b></td>
        <td class="num muted"><b>${FX.fmt.pct(tot.ing > 0 ? (tot.util / tot.ing) * 100 : 0)}</b></td>
      </tr>` : '';

    document.querySelectorAll('#tablaVeh th[data-orden]').forEach(th => {
      th.classList.toggle('ordenado', th.dataset.orden === campo);
      th.dataset.dir = th.dataset.orden === campo ? (desc ? 'desc' : 'asc') : '';
      th.onclick = () => {
        // Al cambiar de columna se empieza por lo más alto, que es lo que
        // uno quiere ver primero; volver a pulsar invierte.
        ordenVeh = th.dataset.orden === campo
          ? { campo, desc: !desc }
          : { campo: th.dataset.orden, desc: th.dataset.orden !== 'nombre' };
        pintarVehiculos(porVehiculo);
      };
    });
  }

  /* ==================================================================
     CARTAS PORTE DEL PERIODO
     ------------------------------------------------------------------
     El tablero de arriba dice cómo fue el conjunto; esta tabla dice de qué
     está hecho. Se ordena por cualquier columna, se filtra dentro sin tocar
     los filtros de arriba, y cada fila abre su auditoría, que es a donde se
     va cuando una carta porte no cuadra.
     ================================================================== */
  let ordenCP = { campo: 'fecha', desc: true };
  let cpDelPeriodo = [];

  function pintarCartasPorte(periodo) {
    cpDelPeriodo = periodo.map(r => {
      const cos = costoDe(r);
      const ing = Number(r.ingresos) || 0;
      return {
        r,
        fecha: r.fecha, cartaPorte: String(r.cartaPorte || ''),
        ciudad: r.ciudad || '', placa: r.placa || '',
        proveedor: r.proveedor || '', tipoRuta: r.tipoRuta || '',
        ped: Number(r.pedidos) || 0, peso: Number(r.pesoTotal) || 0,
        ing, cos, util: ing - cos, margen: ing ? ((ing - cos) / ing) * 100 : 0
      };
    });
    dibujarCartasPorte();
  }

  function dibujarCartasPorte() {
    const tabla = $('tablaCP');
    if (!tabla) return;

    const busca = String(($('buscaCP') || {}).value || '').trim().toUpperCase();
    const filas = cpDelPeriodo.filter(f => !busca ||
      f.cartaPorte.toUpperCase().includes(busca) ||
      f.placa.toUpperCase().includes(busca) ||
      f.ciudad.toUpperCase().includes(busca) ||
      f.proveedor.toUpperCase().includes(busca));

    const { campo, desc } = ordenCP;
    filas.sort((a, b) => {
      const x = a[campo], y = b[campo];
      const cmp = typeof x === 'string' ? String(x).localeCompare(String(y)) : x - y;
      return desc ? -cmp : cmp;
    });

    const tot = filas.reduce((t, f) => {
      t.ped += f.ped; t.peso += f.peso; t.ing += f.ing; t.cos += f.cos; t.util += f.util;
      return t;
    }, { ped: 0, peso: 0, ing: 0, cos: 0, util: 0 });

    tabla.querySelector('tbody').innerHTML = filas.map(f => `
      <tr class="${f.util < 0 ? 'veh-rojo' : ''}">
        <td>${FX.escapar(FX.fmt.fecha(f.fecha))}</td>
        <td><a class="link" href="AuditoriaCP.html?cp=${encodeURIComponent(f.cartaPorte)}"
               title="Auditar la carta porte ${FX.escapar(f.cartaPorte)}"><b>${FX.escapar(f.cartaPorte)}</b></a></td>
        <td>${FX.escapar(f.ciudad || '—')}</td>
        <td class="mono fs-xs">${FX.escapar(f.placa || '—')}</td>
        <td class="fs-xs">${FX.escapar(f.proveedor || '—')}</td>
        <td><span class="tag">${FX.escapar(f.tipoRuta || 'NORMAL')}</span></td>
        <td class="num">${FX.fmt.num(f.ped)}</td>
        <td class="num muted">${f.peso ? FX.fmt.dec(f.peso, 0) : '—'}</td>
        <td class="num c-ingreso">${FX.fmt.money(f.ing)}</td>
        <td class="num c-costo">${FX.fmt.money(f.cos)}</td>
        <td class="num ${f.util < 0 ? 'c-danger' : 'c-ok'}"><b>${FX.fmt.money(f.util)}</b></td>
        <td class="num ${f.util < 0 ? 'c-danger' : 'muted'}">${FX.fmt.pct(f.margen)}</td>
      </tr>`).join('') ||
      `<tr><td colspan="12" class="center muted">Ninguna carta porte coincide con «${FX.escapar(busca)}».</td></tr>`;

    tabla.querySelector('tfoot').innerHTML = filas.length ? `
      <tr>
        <td colspan="6"><b>Total · ${FX.fmt.num(filas.length)} carta${filas.length === 1 ? '' : 's'} porte</b></td>
        <td class="num"><b>${FX.fmt.num(tot.ped)}</b></td>
        <td class="num"><b>${tot.peso ? FX.fmt.dec(tot.peso, 0) : '—'}</b></td>
        <td class="num c-ingreso"><b>${FX.fmt.money(tot.ing)}</b></td>
        <td class="num c-costo"><b>${FX.fmt.money(tot.cos)}</b></td>
        <td class="num ${tot.util < 0 ? 'c-danger' : 'c-ok'}"><b>${FX.fmt.money(tot.util)}</b></td>
        <td class="num muted"><b>${FX.fmt.pct(tot.ing ? (tot.util / tot.ing) * 100 : 0)}</b></td>
      </tr>` : '';

    const pie = $('pieCP');
    if (pie) {
      pie.textContent = busca && filas.length !== cpDelPeriodo.length
        ? `${filas.length} de ${cpDelPeriodo.length} · toca el número para auditarla`
        : `${cpDelPeriodo.length} en total · toca el número para auditarla`;
    }

    tabla.querySelectorAll('th[data-orden]').forEach(th => {
      th.classList.toggle('ordenado', th.dataset.orden === campo);
      th.dataset.dir = th.dataset.orden === campo ? (desc ? 'desc' : 'asc') : '';
      th.onclick = () => {
        ordenCP = th.dataset.orden === campo
          ? { campo, desc: !desc }
          : { campo: th.dataset.orden, desc: !['cartaPorte', 'ciudad', 'placa', 'proveedor', 'tipoRuta'].includes(th.dataset.orden) };
        dibujarCartasPorte();
      };
    });

    const bus = $('buscaCP');
    if (bus && !bus.dataset.listo) {
      bus.dataset.listo = '1';
      let t;
      bus.addEventListener('input', () => { clearTimeout(t); t = setTimeout(dibujarCartasPorte, 200); });
    }

    /* Auditar de golpe todo lo que está en la tabla: es el puente entre
       «aquí hay algo raro» y «a ver qué se cobró en cada pedido». */
    const btn = $('btnAuditar');
    if (btn) {
      btn.onclick = () => {
        if (!filas.length) { FX.toast('No hay cartas porte que auditar.', 'warn'); return; }
        const cps = filas.map(f => f.cartaPorte);
        if (cps.length > 60) {
          FX.toast(`Son ${cps.length} cartas porte: filtra un poco antes de auditarlas.`, 'warn');
          return;
        }
        location.href = 'AuditoriaCP.html?cp=' + encodeURIComponent(cps.join(','));
      };
    }
  }

  function pintarComparativa(periodo, ciudad) {
    const card = $('cardComparativa');
    if (!PROYECCIONES.length) { card.hidden = true; return; }

    // Lo real del día, agrupado por fecha
    const realPorDia = {};
    periodo.forEach(r => {
      if (!realPorDia[r.fecha]) realPorDia[r.fecha] = { pedidos: 0, ing: 0, cos: 0 };
      realPorDia[r.fecha].pedidos += Number(r.pedidos) || 0;
      realPorDia[r.fecha].ing     += Number(r.ingresos) || 0;
      realPorDia[r.fecha].cos     += costoDe(r);
    });

    const filas = PROYECCIONES
      .filter(p => realPorDia[p.fecha])
      .filter(p => ciudad === 'TODAS' || !p.ciudad || p.ciudad === ciudad)
      .sort((a, b) => b.fecha.localeCompare(a.fecha));

    if (!filas.length) { card.hidden = true; return; }
    card.hidden = false;

    const par = (proy, real, fmt) => {
      const dif = real - proy;
      const color = Math.abs(dif) < 0.01 ? 'muted' : dif >= 0 ? 'c-ok' : 'c-danger';
      return `${fmt(proy)} <span class="muted">→</span> <b class="${color}">${fmt(real)}</b>`;
    };

    let sProyU = 0, sRealU = 0;

    document.querySelector('#tablaComparativa tbody').innerHTML = filas.map(p => {
      const r = realPorDia[p.fecha];
      const realUtil = r.ing - r.cos;
      sProyU += p.utilidad; sRealU += realUtil;

      // Qué tan lejos quedó la utilidad real de la proyectada, en porcentaje
      const base = Math.abs(p.utilidad) || 1;
      const desvPct = ((realUtil - p.utilidad) / base) * 100;
      const ancho = Math.min(50, Math.abs(desvPct) / 2);

      return `<tr>
        <td><b>${FX.fmt.fecha(p.fecha)}</b>${p.ciudad ? `<br><span class="fs-xs muted">${FX.escapar(p.ciudad)}</span>` : ''}</td>
        <td class="num">${par(p.pedidos, r.pedidos, FX.fmt.num)}</td>
        <td class="num">${par(p.ingresos, r.ing, FX.fmt.money)}</td>
        <td class="num">${par(p.utilidad, realUtil, FX.fmt.money)}</td>
        <td>
          <div class="desv" title="${desvPct >= 0 ? 'Mejor' : 'Peor'} que lo proyectado en ${FX.fmt.dec(Math.abs(desvPct), 0)}%">
            <span class="eje"></span>
            <i class="${desvPct >= 0 ? 'pos' : 'neg'}" style="width:${ancho}%"></i>
          </div>
          <span class="fs-xs ${desvPct >= 0 ? 'c-ok' : 'c-danger'}">${desvPct >= 0 ? '+' : '−'}${FX.fmt.dec(Math.abs(desvPct), 0)}%</span>
        </td>
      </tr>`;
    }).join('');

    const difTotal = sRealU - sProyU;
    document.querySelector('#tablaComparativa tfoot').innerHTML = `
      <tr>
        <td>${filas.length} día${filas.length === 1 ? '' : 's'} comparado${filas.length === 1 ? '' : 's'}</td>
        <td colspan="2" class="num muted fs-xs">Utilidad acumulada</td>
        <td class="num">${FX.fmt.money(sProyU)} <span class="muted">→</span>
            <b class="${difTotal >= 0 ? 'c-ok' : 'c-danger'}">${FX.fmt.money(sRealU)}</b></td>
        <td class="fs-xs ${difTotal >= 0 ? 'c-ok' : 'c-danger'}">
            ${difTotal >= 0 ? 'Se superó por ' : 'Faltaron '}${FX.fmt.money(Math.abs(difTotal))}</td>
      </tr>`;
  }

  /* ==================================================================
     ARRANQUE
     ================================================================== */
  let PROYECCIONES = [];
  try {
    [TODAS, PROYECCIONES] = await Promise.all([
      API.rutas(),
      API.proyecciones().catch(() => [])
    ]);
  } catch (err) {
    $('contenido').innerHTML = `<div class="note danger">${FX.icono('alert')}<div>No se pudieron cargar los datos: ${FX.escapar(err.message)}</div></div>`;
    return;
  }

  /* Quién puede ver qué: un administrador ve la operación completa, cualquier
     otro rol solo lo que él mismo cargó. Se filtra aquí, apenas llega el
     dato, para que ningún filtro ni exportación pueda mostrar lo de otro. */
  const esAdmin = FX.esAdministrador(sesion);
  if (!esAdmin) {
    TODAS = FX.soloLoMio(TODAS, sesion);
    PROYECCIONES = FX.soloLoMio(PROYECCIONES, sesion);
    $('subtitulo').textContent = 'Solo se muestra lo que tú registraste. Un administrador ve la operación completa.';
    const campoUsuario = $('filtroUsuario').closest('.field');
    if (campoUsuario) campoUsuario.style.display = 'none';
  }

  /* ==================================================================
     FILTROS
     ------------------------------------------------------------------
     Cada desplegable se arma con lo que de verdad hay en los datos: no
     tiene sentido ofrecer un proveedor que nunca movió una carta porte.
     ================================================================== */
  const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);

  const llenar = (id, valores, etiquetaTodos) => {
    const sel = $(id);
    const previo = sel.value;
    sel.innerHTML = `<option value="${id === 'filtroCiudad' ? 'TODAS' : 'TODOS'}">${etiquetaTodos}</option>` +
      valores.map(v => `<option value="${FX.escapar(v)}">${FX.escapar(v)}</option>`).join('');
    if (previo && [...sel.options].some(o => o.value === previo)) sel.value = previo;
    return sel;
  };

  const unicos = campo => [...new Set(TODAS.map(r => r[campo]).filter(Boolean))].sort();

  const ciudadesConDatos = unicos('ciudad');
  llenar('filtroCiudad',    ciudadesConDatos, 'Todas');
  llenar('filtroUsuario',   unicos('usuario'), 'Todos');
  llenar('filtroProveedor', unicos('proveedor'), 'Todos');
  llenar('filtroRuta',      unicos('tipoRuta'), 'Todos');

  // Arranca en la ciudad del usuario si tiene movimiento
  if (sesion.ciudad && ciudadesConDatos.includes(String(sesion.ciudad).toUpperCase())) {
    $('filtroCiudad').value = String(sesion.ciudad).toUpperCase();
  }

  /* ------------------------------------------------------------------
     CLIENTE
     DB_Simulador guarda los ids de los pedidos, no su cliente. Para poder
     filtrar por cliente se cruzan esos ids con el monitor, que sí lo
     tiene. El monitor no llega a las fechas más viejas, así que las
     cartas porte que no se puedan clasificar se dicen en pantalla en vez
     de desaparecer sin explicación.
     ------------------------------------------------------------------ */
  let sinClasificar = 0;
  try {
    const monitor = await API.monitorCompleto();
    const porId = new Map();
    monitor.forEach(p => porId.set(API.claveCodigo(p.idPedido), p.cliente));

    TODAS.forEach(r => {
      const ids = String(r.listaIds || '').split(',')
        .map(t => API.claveCodigo(t.split('-')[0]))
        .filter(Boolean);
      const cs = new Set();
      ids.forEach(id => { const c = porId.get(id); if (c) cs.add(c); });
      r.clientes = cs;
      if (!cs.size && ids.length) sinClasificar++;
    });

    const clientes = [...new Set(TODAS.flatMap(r => [...r.clientes]))].sort();
    llenar('filtroCliente', clientes, 'Todos');
  } catch (e) {
    // Sin monitor no hay filtro por cliente, pero el resto del tablero sirve.
    $('filtroCliente').innerHTML = '<option value="TODOS">Todos (monitor no disponible)</option>';
    $('filtroCliente').disabled = true;
  }

  /* ---- Rango de fechas ---- */
  const fDesde = $('fDesde'), fHasta = $('fHasta');

  function ponerRango(desde, hasta) {
    fDesde.value = desde; fHasta.value = hasta;
  }
  function atajo(cual) {
    const hoy = hoyISO();
    if (cual === 'hoy')  return ponerRango(hoy, hoy);
    if (cual === 'ayer') { const a = sumaDias(hoy, -1); return ponerRango(a, a); }
    if (cual === 'mes')  return ponerRango(hoy.slice(0, 8) + '01', hoy);
    return ponerRango(sumaDias(hoy, -(Number(cual) - 1)), hoy);
  }
  atajo('30');                       // arranque: los últimos 30 días

  const filtroActual = () => ({
    desde:     fDesde.value || '0000-01-01',
    hasta:     fHasta.value || '9999-12-31',
    /* Las cartas porte se comparan por claveCodigo, así que da igual que se
       peguen como 70.236, 70 236 o 070236. */
    cps:       API.listaDeCodigos($('filtroCP').value).map(API.claveCodigo),
    cpsTexto:  API.listaDeCodigos($('filtroCP').value).join(', '),
    ciudad:    $('filtroCiudad').value,
    cliente:   $('filtroCliente').value,
    usuario:   $('filtroUsuario').value,
    proveedor: $('filtroProveedor').value,
    tipoRuta:  $('filtroRuta').value,
    busca:     $('filtroBusca').value
  });

  function repintar() {
    const f = filtroActual();
    if (f.desde > f.hasta) {           // fechas al revés: se enderezan solas
      ponerRango(f.hasta, f.desde);
      return repintar();
    }
    marcarAtajo();
    contarFiltro(f);
    /* Con lista de cartas porte las fechas no pintan nada: se apagan para que
       nadie las mueva esperando que cambie algo. */
    $('cajaFiltros').classList.toggle('con-lista', !!(f.cps && f.cps.length));
    render(f);
  }

  /* Deja iluminado el atajo que coincide con el rango puesto a mano. */
  function marcarAtajo() {
    const hoy = hoyISO(), d = fDesde.value, h = fHasta.value;
    const cual =
      (d === hoy && h === hoy) ? 'hoy' :
      (d === sumaDias(hoy, -1) && h === sumaDias(hoy, -1)) ? 'ayer' :
      (d === hoy.slice(0, 8) + '01' && h === hoy) ? 'mes' :
      (h === hoy && d === sumaDias(hoy, -6))  ? '7' :
      (h === hoy && d === sumaDias(hoy, -29)) ? '30' :
      (h === hoy && d === sumaDias(hoy, -89)) ? '90' : '';
    document.querySelectorAll('[data-atajo]').forEach(b =>
      b.classList.toggle('on', b.dataset.atajo === cual));
  }

  /* Una línea que dice qué se está mirando: con siete filtros es fácil
     olvidar que quedó uno puesto y creer que no hay datos. */
  function contarFiltro(f) {
    const puestos = [];
    if (f.ciudad    !== 'TODAS') puestos.push(f.ciudad);
    if (f.cliente   !== 'TODOS') puestos.push(f.cliente);
    if (f.usuario   !== 'TODOS') puestos.push(f.usuario);
    if (f.proveedor !== 'TODOS') puestos.push(f.proveedor);
    if (f.tipoRuta  !== 'TODOS') puestos.push(f.tipoRuta);
    if (f.busca)                 puestos.push(`«${f.busca}»`);

    /* Con lista de cartas porte el rango de fechas no manda, y decirlo evita
       la llamada de «puse 30 días y me salen cosas de marzo». */
    let txt = (f.cps && f.cps.length)
      ? `${f.cps.length} carta${f.cps.length === 1 ? '' : 's'} porte: ${f.cpsTexto}` +
        ` · sin importar la fecha` +
        (puestos.length ? ' · ' + puestos.map(FX.escapar).join(' · ') : '')
      : `Del ${FX.fmt.fecha(f.desde)} al ${FX.fmt.fecha(f.hasta)}` +
        (puestos.length ? ' · ' + puestos.map(FX.escapar).join(' · ') : ' · sin más filtros');
    if (f.cliente !== 'TODOS' && sinClasificar) {
      txt += ` · ${sinClasificar} carta${sinClasificar === 1 ? '' : 's'} porte antigua${
        sinClasificar === 1 ? '' : 's'} no se pueden filtrar por cliente: sus pedidos ya no están en el monitor`;
    }
    $('resumenFiltro').textContent = txt;
  }

  document.querySelectorAll('[data-atajo]').forEach(b => {
    b.onclick = () => { atajo(b.dataset.atajo); repintar(); };
  });
  ['fDesde', 'fHasta', 'filtroCiudad', 'filtroCliente', 'filtroUsuario',
   'filtroProveedor', 'filtroRuta'].forEach(id => $(id).addEventListener('change', repintar));

  // La búsqueda libre y la lista de cartas porte esperan a que dejes de escribir
  let temporizador;
  ['filtroBusca', 'filtroCP'].forEach(id => {
    $(id).addEventListener('input', () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(repintar, 250);
    });
  });

  $('btnLimpiar').onclick = () => {
    ['filtroCiudad'].forEach(id => { $(id).value = 'TODAS'; });
    ['filtroCliente', 'filtroUsuario', 'filtroProveedor', 'filtroRuta']
      .forEach(id => { $(id).value = 'TODOS'; });
    $('filtroBusca').value = '';
    $('filtroCP').value = '';
    atajo('30');
    repintar();
  };

  /* ==================================================================
     DESCARGAS
     ------------------------------------------------------------------
     Las dos exportan lo que está en pantalla con los filtros puestos, no
     el histórico entero: si filtraste por un cliente y una semana, eso es
     lo que baja.
     ================================================================== */

  /** Nombre de archivo que dice qué trae, para no tener veinte «reporte.csv». */
  function nombreArchivo(ext) {
    const f = loQueSeVe.filtro || {};
    if (f.cps && f.cps.length) {
      // Por cartas porte la fecha no dice nada: el nombre lleva cuáles son
      const cps = f.cpsTexto.split(', ');
      return 'dashboard_CP_' + (cps.length > 3
        ? `${cps[0]}_a_${cps[cps.length - 1]}_${cps.length}CP` : cps.join('-')) + '.' + ext;
    }
    const trozos = ['dashboard', f.desde, f.hasta];
    ['ciudad', 'cliente', 'usuario', 'proveedor', 'tipoRuta'].forEach(k => {
      const v = f[k];
      if (v && v !== 'TODAS' && v !== 'TODOS') trozos.push(String(v).replace(/[^\w-]+/g, '_'));
    });
    return trozos.join('_') + '.' + ext;
  }

  $('btnExcel').onclick = () => {
    const { filas, filtro } = loQueSeVe;
    if (!filas.length) { FX.toast('No hay nada que descargar con estos filtros.', 'warn'); return; }

    const dec = n => String((Math.round((Number(n) || 0) * 100) / 100).toFixed(2)).replace('.', ',');
    const cab = ['Fecha', 'Carta porte', 'Ciudad', 'Placa', 'Proveedor', 'Tipo de ruta',
                 'Ingresado por', 'Clientes', 'Pedidos', 'Ingresos', 'Costo vehículo',
                 'Costo estibas', 'Otros costos', 'Costo total', 'Utilidad', 'Margen %'];

    const cuerpo = filas
      .slice()
      .sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.cartaPorte).localeCompare(String(b.cartaPorte)))
      .map(r => {
        const costo = costoDe(r);
        const util  = (Number(r.ingresos) || 0) - costo;
        const margen = r.ingresos ? (util / r.ingresos) * 100 : 0;
        return [r.fecha, r.cartaPorte, r.ciudad, r.placa, r.proveedor, r.tipoRuta, r.usuario,
                [...(r.clientes || [])].join(' / '),
                r.pedidos, dec(r.ingresos), dec(r.cBase), dec(r.cAyudantes),
                dec((Number(r.cExc) || 0) + (Number(r.cHE) || 0)),
                dec(costo), dec(util), dec(margen)];
      });

    // Fila de totales: es lo primero que se busca al abrir el archivo
    const t = filas.reduce((o, r) => {
      o.ped += Number(r.pedidos) || 0; o.ing += Number(r.ingresos) || 0; o.cos += costoDe(r);
      return o;
    }, { ped: 0, ing: 0, cos: 0 });
    const utilT = t.ing - t.cos;
    cuerpo.push([]);
    cuerpo.push(['TOTAL', filas.length + ' cartas porte', '', '', '', '', '', '',
                 t.ped, dec(t.ing), '', '', '', dec(t.cos), dec(utilT),
                 dec(t.ing ? (utilT / t.ing) * 100 : 0)]);

    const escapa = v => {
      const x = String(v == null ? '' : v);
      return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
    };
    // Punto y coma y BOM: así Excel en español lo abre en columnas sin preguntar.
    cuerpo.push([]);
    cuerpo.push([`© ${CONFIG.ANIO || ''} ${CONFIG.AUTOR || ''}. Todos los derechos reservados.`]);
    const csv = '\uFEFF' + [cab, ...cuerpo].map(f => f.map(escapa).join(';')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = nombreArchivo('csv'); a.click();
    URL.revokeObjectURL(url);
    FX.toast(`${filas.length} cartas porte descargadas.`, 'ok');
  };

  /* Un <svg> de la pantalla convertido en imagen, para poder meterlo en el
     PDF. Los gráficos se dibujan a mano aquí, así que serializarlos es
     fiable; se pinta a 2x para que no salgan borrosos. */
  function svgAImagen(svg, escala) {
    return new Promise(resolve => {
      try {
        const copia = svg.cloneNode(true);
        const caja = svg.getBoundingClientRect();
        const w = Math.max(1, Math.round(caja.width)), h = Math.max(1, Math.round(caja.height));
        copia.setAttribute('width', w); copia.setAttribute('height', h);
        copia.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        copia.style.background = '#ffffff';

        /* Los colores de los gráficos vienen de app.css, y una copia del SVG
           sacada del documento se queda sin esa hoja: todo se pintaba negro.
           Así que se copia el estilo YA CALCULADO de cada nodo vivo a su
           gemelo de la copia. */
        const PROPS = ['fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin',
                       'stroke-dasharray', 'opacity', 'fill-opacity', 'stroke-opacity',
                       'font-size', 'font-family', 'font-weight', 'text-anchor',
                       'dominant-baseline', 'letter-spacing'];
        const vivos = [svg, ...svg.querySelectorAll('*')];
        const clones = [copia, ...copia.querySelectorAll('*')];
        for (let i = 0; i < vivos.length && i < clones.length; i++) {
          const cs = getComputedStyle(vivos[i]);
          PROPS.forEach(prop => {
            const v = cs.getPropertyValue(prop);
            if (v && v !== 'none' || prop === 'fill' || prop === 'stroke') {
              clones[i].style.setProperty(prop, v);
            }
          });
        }
        const texto = new XMLSerializer().serializeToString(copia);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = w * (escala || 2); c.height = h * (escala || 2);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          /* JPEG y no PNG: un gráfico a 2x en PNG dejaba el archivo en 16 MB,
             que nadie manda por correo. En JPEG al 88% pesa una fracción y
             en papel no se nota la diferencia. */
          resolve({ datos: c.toDataURL('image/jpeg', 0.88), w, h });
        };
        img.onerror = () => resolve(null);
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(texto);
      } catch (e) { resolve(null); }
    });
  }

  $('btnPdf').onclick = async function () {
    const { filas, filtro } = loQueSeVe;
    if (!filas.length) { FX.toast('No hay nada que descargar con estos filtros.', 'warn'); return; }
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      FX.toast('Falta assets/vendor/jspdf.umd.min.js', 'danger');
      return;
    }

    const liberar = FX.ocupar(this, 'Armando el PDF…');
    try {
      const { jsPDF } = window.jspdf;

      /* La fuente que trae jsPDF no tiene el signo menos «−» (U+2212) que usa
         FX.fmt.money, y lo dibujaba como una comilla: «"$25,00» en vez de
         «-$25,00». Para el PDF se cambia por un guion normal. */
      const pdf = v => String(v == null ? '' : v).replace(/\u2212/g, '-');
      const $$ = { money: n => pdf(FX.fmt.money(n)), pct: n => pdf(FX.fmt.pct(n)),
                   num: n => pdf(FX.fmt.num(n)) };
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const ancho = doc.internal.pageSize.getWidth();
      const M = 12;
      let y = M;

      // --- Encabezado ---
      doc.setFontSize(16); doc.setFont(undefined, 'bold');
      doc.text('Dashboard de rentabilidad', M, y + 4);
      doc.setFontSize(9); doc.setFont(undefined, 'normal'); doc.setTextColor(110);
      y += 10;
      doc.text($('resumenFiltro').textContent || '', M, y, { maxWidth: ancho - M * 2 });
      y += 5;
      doc.text('Generado el ' + new Date().toLocaleString('es-EC') +
               ' por ' + (sesion.nombre || sesion.usuario || ''), M, y);
      doc.setTextColor(0);
      y += 7;

      // --- Indicadores ---
      const t = filas.reduce((o, r) => {
        o.ped += Number(r.pedidos) || 0; o.ing += Number(r.ingresos) || 0; o.cos += costoDe(r);
        return o;
      }, { ped: 0, ing: 0, cos: 0 });
      const util = t.ing - t.cos;
      const margen = t.ing ? (util / t.ing) * 100 : 0;

      doc.autoTable({
        startY: y,
        head: [['Cartas porte', 'Pedidos', 'Ingresos', 'Costos', 'Utilidad', 'Margen']],
        body: [[filas.length, $$.num(t.ped), $$.money(t.ing),
                $$.money(t.cos), $$.money(util), $$.pct(margen)]],
        theme: 'grid',
        styles: { fontSize: 10, halign: 'center', cellPadding: 2.5 },
        headStyles: { fillColor: [235, 238, 242], textColor: 40, fontStyle: 'bold' },
        bodyStyles: { fontStyle: 'bold' },
        margin: { left: M, right: M }
      });
      y = doc.lastAutoTable.finalY + 6;

      // --- Gráficos, tal como se ven ---
      const svgs = [...document.querySelectorAll('#contenido svg')]
        .filter(s => s.getBoundingClientRect().width > 200);
      const alto = doc.internal.pageSize.getHeight();
      for (const svg of svgs) {
        const img = await svgAImagen(svg, 1.6);
        if (!img) continue;
        let w = ancho - M * 2;
        let h = (img.h / img.w) * w;
        // Tope de altura: sin esto cada gráfico se comía una hoja entera y el
        // reporte salía con media página en blanco entre uno y otro.
        const tope = 68;
        if (h > tope) { h = tope; w = (img.w / img.h) * h; }
        if (y + h > alto - M) { doc.addPage(); y = M; }
        doc.addImage(img.datos, 'JPEG', M, y, w, h, undefined, 'FAST');
        y += h + 5;
      }

      // --- Detalle carta porte por carta porte ---
      const cuerpo = filas.slice()
        .sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.cartaPorte).localeCompare(String(b.cartaPorte)))
        .map(r => {
          const costo = costoDe(r);
          const u = (Number(r.ingresos) || 0) - costo;
          return [FX.fmt.fecha(r.fecha), r.cartaPorte, r.ciudad, r.placa, r.proveedor,
                  r.tipoRuta, r.usuario, r.pedidos,
                  $$.money(r.ingresos), $$.money(costo), $$.money(u),
                  $$.pct(r.ingresos ? (u / r.ingresos) * 100 : 0)];
        });

      doc.addPage();
      doc.autoTable({
        startY: M,
        head: [['Fecha', 'CP', 'Ciudad', 'Placa', 'Proveedor', 'Ruta', 'Cargó',
                'Ped.', 'Ingresos', 'Costos', 'Utilidad', 'Margen']],
        body: cuerpo,
        foot: [['Total', filas.length + ' CP', '', '', '', '', '', $$.num(t.ped),
                $$.money(t.ing), $$.money(t.cos), $$.money(util), $$.pct(margen)]],
        theme: 'striped',
        styles: { fontSize: 7.5, cellPadding: 1.4, overflow: 'linebreak' },
        headStyles: { fillColor: [35, 45, 60], textColor: 255, fontSize: 7.5 },
        footStyles: { fillColor: [235, 238, 242], textColor: 20, fontStyle: 'bold' },
        columnStyles: { 7: { halign: 'right' }, 8: { halign: 'right' }, 9: { halign: 'right' },
                        10: { halign: 'right' }, 11: { halign: 'right' } },
        margin: { left: M, right: M }
      });

      // Numeración, que en un reporte de varias hojas hace falta
      const paginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= paginas; i++) {
        doc.setPage(i);
        doc.setFontSize(8); doc.setTextColor(130);
        doc.text(`${i} de ${paginas}`, ancho - M, doc.internal.pageSize.getHeight() - 6, { align: 'right' });
        doc.text(`${CONFIG.APP_NOMBRE || ''} · © ${CONFIG.ANIO || ''} ${CONFIG.AUTOR || ''}. Todos los derechos reservados.`,
                 M, doc.internal.pageSize.getHeight() - 6);
      }

      doc.save(nombreArchivo('pdf'));
      FX.toast('PDF descargado.', 'ok');
    } catch (err) {
      FX.toast('No se pudo armar el PDF: ' + (err.message || err), 'danger');
    } finally {
      liberar();
    }
  };

  // Los gráficos leen colores del tema, así que se redibujan al cambiarlo
  addEventListener('app:tema', repintar);

  repintar();
});
</script>
