<!DOCTYPE html>
<!-- Sistema de Rentabilidad · Distribución
     © 2026 Héctor Torres. Todos los derechos reservados. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Héctor Torres">
<meta name="copyright" content="© 2026 Héctor Torres. Todos los derechos reservados.">
<title>Inicio · Rentabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .saludo h1 { font-size: clamp(1.5rem, 2.6vw, 2rem); letter-spacing: -.028em; }
  /* Sin `capitalize`: en español pondría mayúscula también en «de». */
  .saludo .fecha { color: var(--ink-muted); font-size: var(--t-sm); margin-top: 2px; }
  .saludo .fecha::first-letter { text-transform: uppercase; }

  /* Aviso de trabajo pendiente */
  .pendiente {
    display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap;
    padding: var(--s-4) var(--s-5); border-radius: var(--r-lg);
    background: var(--warn-soft); border: 1px solid var(--warn-line);
  }
  .pendiente .ico { width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center;
                    background: var(--surface-raised); color: var(--warn); border: 1px solid var(--warn-line); flex-shrink: 0; }
  .pendiente .ico svg { width: 19px; height: 19px; }
  .pendiente b { color: var(--warn); display: block; font-size: var(--t-md); }
  .pendiente span { font-size: var(--t-sm); color: var(--ink-soft); }

  /* Accesos a módulos */
  .modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s-4); }
  .modulo {
    display: flex; flex-direction: column; gap: var(--s-3);
    padding: var(--s-5); border-radius: var(--r-lg);
    background: var(--surface-raised); border: 1px solid var(--line);
    text-decoration: none; color: inherit;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .modulo:hover { border-color: var(--accent-line); transform: translateY(-2px); box-shadow: var(--shadow-md); text-decoration: none; }
  .modulo .cab { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .modulo .ico { width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center;
                 background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .modulo .ico svg { width: 19px; height: 19px; }
  .modulo.sensible .ico { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
  .modulo h3 { font-size: var(--t-md); }
  .modulo p { font-size: var(--t-sm); color: var(--ink-muted); line-height: 1.5; }
  .modulo .flecha { color: var(--ink-muted); transition: transform .18s, color .18s; }
  .modulo:hover .flecha { transform: translateX(3px); color: var(--accent); }
  .modulo .flecha svg { width: 17px; height: 17px; }

  /* Barra de actividad reciente */
  .mini-dia { display: flex; align-items: flex-end; gap: 3px; height: 42px; margin-top: var(--s-3); }
  .mini-dia i { flex: 1; border-radius: 2px 2px 0 0; background: var(--accent); opacity: .8; min-height: 2px; display: block; }
  .mini-dia i.neg { background: var(--danger); }

</style>
</head>
<body data-modulo="inicio">

<main class="page">

  <div class="page-head saludo">
    <div>
      <h1 id="titulo">Hola</h1>
      <div class="fecha" id="fecha"></div>
    </div>
    <div class="row" id="acciones"></div>
  </div>

  <div class="stack">

    <!-- Trabajo pendiente -->
    <div id="zonaPendiente"></div>

    <!-- Pulso del negocio -->
    <section>
      <div class="row row-between mb-3">
        <h2 style="font-size:var(--t-lg)">Últimos 30 días</h2>
        <span class="muted fs-sm" id="rangoTexto"></span>
      </div>
      <div class="grid grid-4" id="indicadores">
        <div class="stat"><div class="skel" style="height:14px;width:60%"></div><div class="skel mt-3" style="height:28px;width:80%"></div></div>
        <div class="stat"><div class="skel" style="height:14px;width:60%"></div><div class="skel mt-3" style="height:28px;width:80%"></div></div>
        <div class="stat"><div class="skel" style="height:14px;width:60%"></div><div class="skel mt-3" style="height:28px;width:80%"></div></div>
        <div class="stat"><div class="skel" style="height:14px;width:60%"></div><div class="skel mt-3" style="height:28px;width:80%"></div></div>
      </div>
    </section>

    <!-- Accesos -->
    <section>
      <h2 style="font-size:var(--t-lg)" class="mb-3">Tus módulos</h2>
      <div class="modulos" id="modulos"></div>
    </section>

    <!-- Diagnóstico de la conexión -->
    <section id="zonaDiag" hidden>
      <div class="card">
        <div class="card-head">
          <h3>Conexión con la base de datos</h3>
          <button class="btn btn-default btn-sm" id="btnDiag"></button>
        </div>
        <div class="card-body" id="resultadoDiag">
          <p class="fs-sm muted">Comprueba que cada hoja de Drive responde y con cuántos registros. No actualiza los datos: para eso está el botón de recargar de la barra superior.</p>
        </div>
      </div>
    </section>

  </div>

</main>

<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/tarifas.js"></script>
<script src="assets/api.js"></script>
<script>
FX.listo(async (sesion) => {
  'use strict';
  if (!sesion) return;

  /* ---------------- Saludo ---------------- */
  const hora = new Date().getHours();
  const momento = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
  const soloNombre = String(sesion.nombre).split(' ')[0];
  document.getElementById('titulo').textContent = `${momento}, ${soloNombre}`;
  document.getElementById('fecha').textContent =
    new Date().toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  /* ---------------- Módulos permitidos ---------------- */
  const permitidos = FX.permisosDe(sesion);
  document.getElementById('modulos').innerHTML = FX.MODULOS
    // Sin página es un permiso, no una pantalla: no tiene tarjeta a la que ir.
    .filter(m => !m.fijo && m.pagina && permitidos.includes(m.clave))
    .map(m => `
      <a class="modulo ${m.sensible ? 'sensible' : ''}" href="${m.pagina}">
        <div class="cab">
          <span class="ico">${FX.icono(m.icono)}</span>
          <span class="flecha">${FX.icono('down')}</span>
        </div>
        <div>
          <h3>${m.nombre}</h3>
          <p>${m.descripcion}</p>
        </div>
      </a>`)
    .join('');

  // La flecha del icono 'down' apunta hacia abajo; se rota para que apunte a la derecha
  document.querySelectorAll('.modulo .flecha svg').forEach(s => s.style.transform = 'rotate(-90deg)');

  /* ---------------- Datos ---------------- */
  let rutas = [], monitor = [];
  try {
    [rutas, monitor] = await Promise.all([
      API.rutas(),
      permitidos.includes('simcp') ? API.monitorCompleto() : Promise.resolve([])
    ]);
  } catch (err) {
    document.getElementById('indicadores').innerHTML =
      `<div class="note danger" style="grid-column:1/-1">${FX.icono('alert')}<div>No se pudieron cargar los datos: ${FX.escapar(err.message)}</div></div>`;
    return;
  }

  const costoDe = r => (Number(r.cBase)||0) + (Number(r.cExc)||0) + (Number(r.cAyudantes)||0) + (Number(r.cHE)||0);

  /* ---------------- Pendientes de costear ----------------
     Una carta porte está pendiente si aparece en el monitor pero todavía
     no tiene una ruta cerrada en DB_Simulador. */
  const yaCerradas = new Set(rutas.map(r => String(r.cartaPorte).toUpperCase()));
  const monitorConCP = monitor.filter(p => p.cartaPorte && !yaCerradas.has(String(p.cartaPorte).toUpperCase()));
  const cpsPendientes = [...new Set(monitorConCP.map(p => p.cartaPorte))];
  if (cpsPendientes.length) {
    document.getElementById('zonaPendiente').innerHTML = `
      <div class="pendiente">
        <span class="ico">${FX.icono('inbox')}</span>
        <div style="flex:1;min-width:180px">
          <b>${cpsPendientes.length} carta${cpsPendientes.length===1?'':'s'} porte sin costear</b>
          <span>${monitorConCP.length} pedidos esperando que les asignes tarifa y costo de vehículo.</span>
        </div>
        <a class="btn btn-primary" href="SimuladorCartaPorte.html">Costear ahora</a>
      </div>`;
  }

  /* ---------------- Indicadores de 30 días ---------------- */
  const desde = new Date(); desde.setDate(desde.getDate() - 30);
  const desdeISO = desde.toISOString().slice(0, 10);
  const recientes = rutas.filter(r => r.fecha >= desdeISO);

  const ingresos = recientes.reduce((s, r) => s + (Number(r.ingresos) || 0), 0);
  const costos   = recientes.reduce((s, r) => s + costoDe(r), 0);
  const utilidad = ingresos - costos;
  const margen   = ingresos > 0 ? (utilidad / ingresos) * 100 : 0;
  const pedidos  = recientes.reduce((s, r) => s + (Number(r.pedidos) || 0), 0);

  document.getElementById('rangoTexto').textContent =
    `${recientes.length} rutas · ${FX.fmt.num(pedidos)} pedidos`;

  // Serie diaria de utilidad, para la barra de actividad
  const porDia = {};
  recientes.forEach(r => { porDia[r.fecha] = (porDia[r.fecha] || 0) + (Number(r.ingresos)||0) - costoDe(r); });
  const dias = Object.keys(porDia).sort();
  const tope = Math.max(...dias.map(d => Math.abs(porDia[d])), 1);
  const barras = dias.map(d => {
    const v = porDia[d];
    const alto = Math.max(2, Math.round(Math.abs(v) / tope * 100));
    return `<i class="${v < 0 ? 'neg' : ''}" style="height:${alto}%" title="${FX.fmt.fecha(d)}: ${FX.fmt.money(v)}"></i>`;
  }).join('');

  const claseMargen = margen < 0 ? 'danger' : margen < 15 ? 'warn' : 'ok';

  document.getElementById('indicadores').innerHTML = `
    <div class="stat is-ingreso">
      <div class="label">${FX.icono('down')} Ingresos</div>
      <div class="value">${FX.fmt.money(ingresos)}</div>
      <div class="foot">${FX.fmt.num(pedidos)} pedidos entregados</div>
    </div>
    <div class="stat is-costo">
      <div class="label">${FX.icono('truck')} Costo operativo</div>
      <div class="value">${FX.fmt.money(costos)}</div>
      <div class="foot">${recientes.length} rutas despachadas</div>
    </div>
    <div class="stat ${utilidad < 0 ? 'is-neg' : 'is-utilidad'}">
      <div class="label">${FX.icono('chart')} Utilidad</div>
      <div class="value">${FX.fmt.money(utilidad)}</div>
      <div class="foot">Margen ${FX.fmt.pct(margen)}</div>
      <div class="meter ${claseMargen}"><span style="width:${Math.min(100, Math.max(0, margen))}%"></span></div>
    </div>
    <div class="stat">
      <div class="label">${FX.icono('box')} Ritmo diario</div>
      <div class="value">${FX.fmt.money(dias.length ? utilidad / dias.length : 0)}</div>
      <div class="foot">Utilidad promedio por día</div>
      <div class="mini-dia">${barras}</div>
    </div>`;


  /* ---------------- Diagnóstico de conexión ---------------- */
  if (String(sesion.rol || '').toLowerCase().includes('admin')) {
    document.getElementById('zonaDiag').hidden = false;
    const btn = document.getElementById('btnDiag');
    btn.innerHTML = FX.icono('refresh') + ' Probar conexión';

    btn.onclick = async function () {
      const liberar = FX.ocupar(this, 'Probando…');
      const caja = document.getElementById('resultadoDiag');
      try {
        API.limpiarCache();
        const d = await API.diagnostico();
        caja.innerHTML = `
          <div class="stack-sm">
            ${d.pruebas.map(x => `
              <div class="row" style="gap:var(--s-3);align-items:flex-start">
                <span class="badge ${x.ok ? 'ok' : 'danger'}" style="min-width:76px;justify-content:center">
                  ${x.ok ? 'Responde' : 'Falla'}
                </span>
                <span style="flex:1;min-width:0">
                  <b class="fs-sm">${FX.escapar(x.nombre)}</b>
                  <span class="fs-xs muted"> · ${FX.escapar(String(x.detalle))}</span>
                </span>
                <span class="fs-xs muted nowrap">${x.ms} ms</span>
              </div>`).join('')}
          </div>
          <p class="fs-xs muted mt-4" style="word-break:break-all">Origen: ${FX.escapar(d.url)}</p>`;
      } catch (err) {
        caja.innerHTML = `<div class="note danger">${FX.icono('alert')}<div>${FX.escapar(err.message)}</div></div>`;
      } finally { liberar(); }
    };
  }
});
</script>
</body>
</html>
